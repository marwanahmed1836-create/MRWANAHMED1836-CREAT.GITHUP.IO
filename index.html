<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الكهف الغامض</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #1a1518;
            border: 8px solid #ffd700; /* الإطار الذهبي */
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #overlay-text {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            text-align: center;
            pointer-events: none;
            border: 2px dashed #ffd700;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.5);
        }

        #touch-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #ffd700;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            user-select: none;
        }

        .ctrl-btn:active {
            background: rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="overlay-text">WHAT IT COULD BE ????</div>
    <canvas id="gameCanvas"></canvas>
    <div id="touch-controls">
        <div class="ctrl-btn" id="btn-left">←</div>
        <div class="ctrl-btn" id="btn-action">OPEN</div>
        <div class="ctrl-btn" id="btn-right">→</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 800;
    canvas.height = 400;

    let playerX = 100;
    let playerY = 280;
    const playerWidth = 40;
    const playerHeight = 80;
    let isMovingLeft = false;
    let isMovingRight = false;
    let torchIntensity = 0;

    // عناصر التحكم باللمس
    document.getElementById('btn-left').addEventListener('touchstart', () => isMovingLeft = true);
    document.getElementById('btn-left').addEventListener('touchend', () => isMovingLeft = false);
    document.getElementById('btn-right').addEventListener('touchstart', () => isMovingRight = true);
    document.getElementById('btn-right').addEventListener('touchend', () => isMovingRight = false);

    // عناصر التحكم بلوحة المفاتيح
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') isMovingLeft = true;
        if (e.key === 'ArrowRight' || e.key === 'd') isMovingRight = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') isMovingLeft = false;
        if (e.key === 'ArrowRight' || e.key === 'd') isMovingRight = false;
    });

    function drawCave() {
        // الخلفية الصخرية
        ctx.fillStyle = '#141416';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // تفاصيل الصخور والنتوءات
        ctx.fillStyle = '#221e22';
        ctx.fillRect(0, 350, canvas.width, 50); // الأرضية
        ctx.fillRect(0, 0, 50, canvas.height); // الجدار الأيسر
        ctx.fillRect(750, 0, 50, canvas.height); // الجدار الأيمن

        // خيوط العنكبوت
        ctx.strokeStyle = '#4a4852';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(100, 100);
        ctx.moveTo(800, 0); ctx.lineTo(700, 100);
        ctx.stroke();
    }

    function drawClouds() {
        ctx.save();
        // تأثير البوابة السحابية في المنتصف
        const gradient = ctx.createRadialGradient(400, 150, 50, 400, 150, 250);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        gradient.addColorStop(0.5, 'rgba(180, 220, 255, 0.6)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(200, 50, 400, 200);

        // سحب بكسلية متداخلة
        ctx.fillStyle = '#ffffff';
        // سحابة 1
        ctx.fillRect(250, 120, 120, 60);
        ctx.fillRect(220, 140, 160, 50);
        // سحابة 2
        ctx.fillRect(430, 100, 140, 70);
        ctx.fillRect(450, 80, 100, 60);

        // جسيمات ضوئية متطايرة نحو البوابة
        ctx.fillStyle = '#ffd700';
        for (let i = 0; i < 5; i++) {
            let x = 350 + Math.sin(Date.now() / 500 + i) * 100;
            let y = 150 + Math.cos(Date.now() / 300 + i) * 30;
            ctx.fillRect(x, y, 6, 6);
        }
        ctx.restore();
    }

    function drawPlayer() {
        ctx.save();
        // حركة بسيطة للشخصية
        let bobbing = Math.sin(Date.now() / 100) * 5;

        // الجسم
        ctx.fillStyle = '#333333';
        ctx.fillRect(playerX, playerY + bobbing, 30, 50);

        // الرأس
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(playerX + 5, playerY - 15 + bobbing, 20, 20);

        // الشعر (أسود)
        ctx.fillStyle = '#111111';
        ctx.fillRect(playerX + 5, playerY - 20 + bobbing, 22, 10);

        // اليد والشعلة
        ctx.fillStyle = '#ff4500'; // لهب الشعلة
        torchIntensity = Math.random() * 10;
        ctx.fillRect(playerX + 35, playerY - 5 + bobbing - torchIntensity, 10, 15);
        
        ctx.fillStyle = '#8B4513'; // مقبض الشعلة
        ctx.fillRect(playerX + 38, playerY + 10 + bobbing, 4, 15);

        ctx.restore();
    }

    function update() {
        if (isMovingLeft && playerX > 20) playerX -= 4;
        if (isMovingRight && playerX < 740) playerX += 4;
    }

    function gameLoop() {
        update();
        drawCave();
        drawClouds();
        drawPlayer();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
