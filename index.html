<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الكهف الغامض</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0908;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            background-color: #151110;
            border: 4px solid #3d2817;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #overlay-text {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #e5a93b;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
        }

        #touch-controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .ctrl-btn {
            background: rgba(40, 30, 20, 0.7);
            border: 2px solid #8c6747;
            color: white;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            user-select: none;
            outline: none;
        }

        .ctrl-btn:active {
            background: rgba(140, 103, 71, 0.9);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="overlay-text">WHAT IT COULD BE ????</div>
        <canvas id="gameCanvas"></canvas>
        <div id="touch-controls">
            <button class="ctrl-btn" id="btn-left">←</button>
            <button class="ctrl-btn" id="btn-action">إضاءة</button>
            <button class="ctrl-btn" id="btn-right">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 900;
        canvas.height = 500;

        let playerX = 100;
        let playerY = 320;
        const playerWidth = 35;
        const playerHeight = 65;
        let isMovingLeft = false;
        let isMovingRight = false;
        let isLighting = false;

        // عناصر التحكم باللمس
        document.getElementById('btn-left').addEventListener('touchstart', () => { isMovingLeft = true; });
        document.getElementById('btn-left').addEventListener('touchend', () => { isMovingLeft = false; });
        document.getElementById('btn-right').addEventListener('touchstart', () => { isMovingRight = true; });
        document.getElementById('btn-right').addEventListener('touchend', () => { isMovingRight = false; });
        document.getElementById('btn-action').addEventListener('touchstart', () => { isLighting = !isLighting; });

        // لوحة المفاتيح للاختبار
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') isMovingLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') isMovingRight = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') isMovingLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') isMovingRight = false;
        });

        function drawCaveBackground() {
            // جدران الكهف الداكنة والعشب
            ctx.fillStyle = '#110e0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // تفاصيل الصخور والكهف المظلم بالخلفية
            ctx.fillStyle = '#1c1714';
            ctx.fillRect(50, 50, 200, 150);
            ctx.fillRect(650, 40, 220, 180);

            // مساحة السماء/السحب الزرقاء المميزة في وسط الصورة
            ctx.fillStyle = '#22527b';
            ctx.fillRect(250, 80, 400, 240);

            // رسومات السحب البيضاء البكسلية داخل المنطقة الزرقاء
            ctx.fillStyle = '#dbe4ee';
            ctx.beginPath();
            ctx.arc(350, 180, 45, 0, Math.PI * 2);
            ctx.arc(420, 160, 60, 0, Math.PI * 2);
            ctx.arc(500, 190, 50, 0, Math.PI * 2);
            ctx.arc(570, 170, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f0f4f8';
            ctx.beginPath();
            ctx.arc(380, 190, 30, 0, Math.PI * 2);
            ctx.arc(470, 170, 45, 0, Math.PI * 2);
            ctx.fill();

            // العنصر المتوهج العائم في المنتصف (الحجر السحري)
            ctx.fillStyle = '#fce251';
            ctx.beginPath();
            ctx.ellipse(470, 180, 12, 18, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            
            // هالة التوهج حول الحجر
            ctx.strokeStyle = 'rgba(252, 226, 81, 0.4)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(470, 180, 25, 0, Math.PI * 2);
            ctx.stroke();

            // الأرضية الخشبية للكهف
            ctx.fillStyle = '#2b1d12';
            ctx.fillRect(0, 380, canvas.width, 120);
            
            ctx.fillStyle = '#3a2618';
            ctx.fillRect(0, 380, canvas.width, 10); // خط الأرض العلوي
        }

        function drawPlayer() {
            // رسم الشخصية (مغامر بملابس داكنة وشعلة نارية)
            // الجسم
            ctx.fillStyle = '#333333';
            ctx.fillRect(playerX, playerY + 15, playerWidth - 10, 35);

            // الرأس والشعر الأسود
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(playerX + 2, playerY, 20, 20);
            ctx.fillStyle = '#111111';
            ctx.fillRect(playerX, playerY - 3, 22, 10);

            // الشعلة اليدوية وتأثير الإضاءة
            ctx.fillStyle = '#8c5830'; // عصا الشعلة
            ctx.fillRect(playerX + 22, playerY + 25, 6, 20);

            // لهب الشعلة البرتقالي
            ctx.fillStyle = '#ff4500';
            ctx.beginPath();
            ctx.arc(playerX + 25, playerY + 20, isLighting ? 14 : 9, 0, Math.PI * 2);
            ctx.fill();

            // توهج الشعلة إذا كانت مضاءة
            if (isLighting) {
                const gradient = ctx.createRadialGradient(playerX + 25, playerY + 20, 10, playerX + 25, playerY + 20, 90);
                gradient.addColorStop(0, 'rgba(255, 165, 0, 0.4)');
                gradient.addColorStop(1, 'rgba(255, 165, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(playerX + 25, playerY + 20, 90, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function update() {
            if (isMovingLeft && playerX > 20) {
                playerX -= 4;
            }
            if (isMovingRight && playerX < canvas.width - 60) {
                playerX += 4;
            }
        }

        function gameLoop() {
            update();
            drawCaveBackground();
            drawPlayer();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
